<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Favorites</title>
    <link rel="stylesheet" href="CSS/fav.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
     <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet">
</head>
<body>

    <nav class="navbar">
        
        <a href="index.html">
            <img src="images/Untitled Project.jpg" alt="JokeNest Logo" class="logo-img" id="logo">
        </a>
        <a href="index.html" class="logo">JokeNest</a>

        <div class="right">
        <ul class="nav-links">
            <li><a href="index.html"><span class="material-icons-outlined">home</span>Home</a></li>
            <li><a href="fav.html"><span class="material-icons-outlined">favorite_border</span>Favorites</a></li>
        </ul>

        <button class="theme-toggle">🌙</button>
        </div>
    </nav>

    <section class="favorites-page">

        <h2 class="fav-title">Saved Jokes</h2>

        
        <div class="search-box">
            <input type="text" placeholder="Search your jokes..." class="search-input">
        </div>

        
        <div class="filter-pills">
            <button class="pill active" data-category="all">All</button>
            <button class="pill" data-category="Programming">Programming</button>
            <button class="pill" data-category="Misc">Misc</button>
            <button class="pill" data-category="Dark">Dark</button>
            <button class="pill" data-category="Pun">Pun</button>
        </div>

        
        <div class="sort-row">
            <button class="sort-btn" data-sort="short">Short → Long</button>
            <button class="sort-btn" data-sort="long">Long → Short</button>
        </div>

       
        <div class="favorites-container" id="favContainer"></div>

        
        <p class="empty-state" id="emptyState">
            No saved jokes yet.
        </p>

    </section>




    <script src="Js/fav.js"></script>
</body>
</html>
